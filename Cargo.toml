[package]
name = "estus"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
eframe = "0.37.0"
egui = "0.37.0"
egui_plot = "0.38.0"
notify-rust = "4.19.0"
rfd = "0.18.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.3"
tray-icon = "0.26.1"
windows-registry = "0.100.0"

[build-dependencies]
embed-manifest = "1.5.1"
